<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nhân viên - Nhà thuốc An Khang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="sidebar">
    <h4>Nhà thuốc An Khang</h4>
    <ul>
      <li><a href="index.html">📊 Tổng quan</a></li>
      <li><a href="sanpham.html">💊 Sản phẩm</a></li>
      <li><a href="danhmuc.html">📂 Danh mục</a></li>
      <li><a href="donhang.html">🧾 Đơn hàng</a></li>
      <li><a href="nhanvien.html" class="active">👨‍⚕️ Nhân viên</a></li>
    </ul>
  </div>

  <div class="header"><span>Quản lý nhân viên</span></div>

  <div class="main-content">
    <h3 class="text-success mb-3">Danh sách nhân viên</h3>
    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalNhanVien">+ Thêm nhân viên</button>

    <table class="table table-bordered table-hover">
      <thead class="table-success">
        <tr><th>Mã</th><th>Tên nhân viên</th><th>Chức vụ</th><th>Email</th><th>Hành động</th></tr>
      </thead>
      <tbody id="tbodyNhanVien"></tbody>
    </table>
  </div>

  <div class="modal fade" id="modalNhanVien" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Nhân viên</h5></div>
        <div class="modal-body">
          <input type="hidden" id="maNhanVien">
          <div class="mb-2"><label>Tên nhân viên</label><input id="tenNhanVien" class="form-control"></div>
          <div class="mb-2"><label>Chức vụ</label><input id="chucVu" class="form-control"></div>
          <div class="mb-2"><label>Email</label><input id="nvEmail" type="email" class="form-control"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button class="btn btn-primary" id="btnSaveNhanVien">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
