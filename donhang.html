<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đơn hàng - Nhà thuốc An Khang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="sidebar">
    <h4>Nhà thuốc An Khang</h4>
    <ul>
      <li><a href="index.html">📊 Tổng quan</a></li>
      <li><a href="sanpham.html">💊 Sản phẩm</a></li>
      <li><a href="danhmuc.html">📂 Danh mục</a></li>
      <li><a href="donhang.html" class="active">🧾 Đơn hàng</a></li>
      <li><a href="nhanvien.html">👨‍⚕️ Nhân viên</a></li>
    </ul>
  </div>

  <div class="header"><span>Quản lý đơn hàng</span></div>

  <div class="main-content">
    <h3 class="text-success mb-3">Danh sách đơn hàng</h3>
    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalDonHang">+ Cập nhật đơn hàng</button>

    <table class="table table-bordered table-hover">
      <thead class="table-success">
        <tr><th>Mã</th><th>Khách hàng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Hành động</th></tr>
      </thead>
      <tbody id="tbodyDonHang"></tbody>
    </table>
  </div>

  <div class="modal fade" id="modalDonHang" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Đơn hàng</h5></div>
        <div class="modal-body">
          <input type="hidden" id="maDonHang">
          <div class="mb-2"><label>Tên khách hàng</label><input id="tenKhachHang" class="form-control"></div>
          <div class="mb-2"><label>Tổng tiền</label><input id="tongTien" type="number" class="form-control"></div>
          <div class="mb-2"><label>Trạng thái</label><input id="trangThai" class="form-control"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button class="btn btn-primary" id="btnSaveDonHang">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
