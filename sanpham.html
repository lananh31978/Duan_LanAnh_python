<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sản phẩm - Nhà thuốc An Khang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="sidebar">
    <h4>Nhà thuốc An Khang</h4>
    <ul>
      <li><a href="index.html">📊 Tổng quan</a></li>
      <li><a href="sanpham.html" class="active">💊 Sản phẩm</a></li>
      <li><a href="danhmuc.html">📂 Danh mục</a></li>
      <li><a href="donhang.html">🧾 Đơn hàng</a></li>
      <li><a href="nhanvien.html">👨‍⚕️ Nhân viên</a></li>
    </ul>
  </div>

  <div class="header"><span>Quản lý sản phẩm</span></div>

  <div class="main-content">
    <h3 class="text-success mb-3">Danh sách sản phẩm</h3>
    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalSanPham">+ Thêm sản phẩm</button>

    <table class="table table-bordered table-hover">
      <thead class="table-success">
        <tr><th>Mã</th><th>Tên sản phẩm</th><th>Giá</th><th>Số lượng</th><th>Danh mục</th><th>Hành động</th></tr>
      </thead>
      <tbody id="tbodySanPham"></tbody>
    </table>
  </div>

  <div class="modal fade" id="modalSanPham" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Sản phẩm</h5></div>
        <div class="modal-body">
          <input type="hidden" id="maSanPham">
          <div class="mb-2"><label>Tên sản phẩm</label><input id="tenSanPham" class="form-control"></div>
          <div class="mb-2"><label>Giá</label><input id="donGia" type="number" class="form-control"></div>
          <div class="mb-2"><label>Số lượng</label><input id="soLuong" type="number" class="form-control"></div>
          <div class="mb-2"><label>Danh mục</label><select id="spDanhMuc" class="form-control"></select></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button class="btn btn-primary" id="btnSaveSanPham">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
